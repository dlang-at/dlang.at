name: Deploy application
on:
  push:
    branches: [production]

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install D compiler
        uses: dlang-community/setup-dlang@0a7469b93f791d83f30932c6fd105796c6966e20
        with:
          compiler: ldc-1.42.0

      - name: Build app
        run: dub -q build -b CI/CD -c http

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: built-application
          path: bin


  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: built-application
          path: bin

      - name: Mark as binary as executable
        run: chmod 0750 bin/dlang-at

      - name: Set up SSH
        env:
          SSH_AUTH_SOCK: /tmp/ssh-agent.sock
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_HOST_NAME: ${{ secrets.SSH_HOST_NAME }}
          SSH_USER_KEY: ${{ secrets.SSH_USER_KEY }}
          SSH_USER_KEY_FILENAME: gha_user_key
        run: |
          mkdir -p "${HOME}/.ssh"
          echo "${SSH_HOST_NAME} ${SSH_HOST_KEY}" >> "${HOME}/.ssh/known_hosts"
          echo "${SSH_USER_KEY}" > "${HOME}/.ssh/${SSH_USER_KEY_FILENAME}"
          chmod 600 "${HOME}/.ssh/${SSH_USER_KEY_FILENAME}"
          ssh-agent -a "${SSH_AUTH_SOCK}" > /dev/null	
          ssh-add "${HOME}/.ssh/${SSH_USER_KEY_FILENAME}"

      - name: Unlink old app binary
        env:
          SSH_AUTH_SOCK: /tmp/ssh-agent.sock
          SSH_DEST_PATH: ${{ secrets.SSH_DEST_PATH }}
          SSH_HOST_NAME: ${{ secrets.SSH_HOST_NAME }}
          SSH_USER_NAME: ${{ secrets.SSH_USER_NAME }}
        run: ssh "${SSH_USER_NAME}@${SSH_HOST_NAME}" -- unlink "${SSH_DEST_PATH}" || true

      - name: Deploy new binary via rsync
        env:
          SSH_AUTH_SOCK: /tmp/ssh-agent.sock
          SSH_DEST_PATH: ${{ secrets.SSH_DEST_PATH }}
          SSH_HOST_NAME: ${{ secrets.SSH_HOST_NAME }}
          SSH_USER_NAME: ${{ secrets.SSH_USER_NAME }}
        run: rsync -zqp bin/dlang-at "${SSH_USER_NAME}@${SSH_HOST_NAME}:${SSH_DEST_PATH}"

      - name: Restart service unit
        env:
          SSH_APP_SERVICE_UNIT: ${{ secrets.SSH_APP_SERVICE_UNIT }}
          SSH_AUTH_SOCK: /tmp/ssh-agent.sock
          SSH_HOST_NAME: ${{ secrets.SSH_HOST_NAME }}
          SSH_USER_NAME: ${{ secrets.SSH_USER_NAME }}
        run: ssh "${SSH_USER_NAME}@${SSH_HOST_NAME}" -- systemctl --user restart "${SSH_APP_SERVICE_UNIT}"
