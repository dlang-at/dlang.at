name: Deploy application
on:
  push:
    branches: [production]

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install D compiler
        uses: dlang-community/setup-dlang@0a7469b93f791d83f30932c6fd105796c6966e20
        with:
          compiler: ldc-1.42.0

      - name: Build app
        run: dub -q build -b CI/CD -c cgi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: built-application
          include-hidden-files: true
          path: bin


  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: built-application
          path: bin

      - name: Set up SSH
        env:
          SSH_AUTH_SOCK: /tmp/ssh-agent.sock
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_HOST_NAME: ${{ secrets.SSH_HOST_NAME }}
          SSH_USER_KEY: ${{ secrets.SSH_USER_KEY }}
          SSH_USER_KEY_FILENAME: gha_user_key
        run: |
          mkdir -p "${HOME}/.ssh"
          echo "${SSH_HOST_NAME} ${SSH_HOST_KEY}" >> "${HOME}/.ssh/known_hosts"
          echo "${SSH_USER_KEY}" > "${HOME}/.ssh/${SSH_USER_KEY_FILENAME}"
          chmod 600 "${HOME}/.ssh/${SSH_USER_KEY_FILENAME}"
          ssh-agent -a "${SSH_AUTH_SOCK}" > /dev/null	
          ssh-add "${HOME}/.ssh/${SSH_USER_KEY_FILENAME}"

      - name: Deploy app via rsync
        env:
          SSH_AUTH_SOCK: /tmp/ssh-agent.sock
          SSH_DEST_DIR: ${{ secrets.SSH_DEST_DIR }}
          SSH_HOST_NAME: ${{ secrets.SSH_HOST_NAME }}
          SSH_USER_NAME: ${{ secrets.SSH_USER_NAME }}
        run: rsync --delete -zqr bin/ "${SSH_USER_NAME}@${SSH_HOST_NAME}:${SSH_DEST_DIR}"
